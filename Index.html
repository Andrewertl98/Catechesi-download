<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download Catechesi</title>
  <style>
    body { font-family: system-ui, sans-serif; text-align: center; padding: 2rem; background: #f8f9fa; }
    .btn { display: inline-block; margin: 0.5rem; padding: 12px 24px; background: #007bff; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; }
    .btn.android { background: #3ddc84; color: #000; }
  </style>
  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isAndroid = /android/i.test(ua);

      if (isIOS) {
        window.location.replace("https://apps.apple.com/us/app/catechesi/id6798878349");
      } else if (isAndroid) {
        window.location.replace("https://play.google.com/store/apps/details?id=com.catechesi.android");
      }
      // If neither, the page stays and shows the buttons below
    })();
  </script>
</head>
<body>
  <h1>Download Catechesi</h1>
  <p>Redirecting you to the right store…</p>
  <p>If nothing happens, choose your platform:</p>
  <a class="btn" href="https://apps.apple.com/us/app/catechesi/id6798878349">App Store (iPhone)</a>
  <a class="btn android" href="https://play.google.com/store/apps/details?id=com.catechesi.android">Google Play (Android)</a>
</body>
</html>
